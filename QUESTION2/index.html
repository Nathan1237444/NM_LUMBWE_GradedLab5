<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

  <h1>Mr. Surname Blender</h1>

  
  <div>
    <span>Surname:</span>
    <input id="surname" type="text" size="20" />
  </div>

  <div>
    <span>Font:</span>
    <select id="font">
      <option>Arial</option>
      <option>Comic Sans MS</option>
      <option>Times New Roman</option>
      <option>Verdana</option>
    </select>


     <select id="color">
      <option value="black">Black</option>
      <option value="red">Red</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
    </select>

 
    <input id="fontsize" type="number" placeholder="font size" value="16" />
  </div>

  <div>
    <span>Position:</span>
    <input id="sequential" name="pos" type="radio" value="seq" checked="checked" /> Sequential
    <input id="random"     name="pos" type="radio" value="rand"            /> Random
    <input id="reverse"    name="pos" type="radio" value="rev"            /> Reverse
  </div>

   <div>
    Go: <button id="blend-btn">Blend Now</button>
  </div>


  <div id="output" style="position:relative; width:400px; height:150px; border:1px solid black;"></div>
</body>
<script src="question2.js"></script>

</html>
